<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | Metcalf</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/symbole.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --noir: #09090a; --ivoire: #f4efe5; --or: #b3924f; --or-clair: #d6bd84; --gris: #9a9385; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Jost", "Segoe UI", system-ui, sans-serif; font-weight: 300; font-size: 17.5px; line-height: 1.75;
    color: var(--gris); background: var(--noir); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 40px 24px; min-height: 100svh;
  }
  img { width: 64px; height: auto; margin-bottom: 36px; opacity: .9; }
  h1 { font-family: "Cormorant Garamond", "Times New Roman", serif; font-weight: 300; color: var(--ivoire); font-size: clamp(38px, 7vw, 72px); line-height: 1.1; margin: 0 0 18px; text-wrap: balance; }
  p { margin: 0 0 36px; max-width: 46ch; }
  a { color: var(--or-clair); text-decoration: none; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; border: 1px solid var(--or); padding: 14px 28px; transition: background .3s, color .3s; }
  a:hover, a:focus-visible { background: var(--or); color: var(--noir); }
</style>
</head>
<body>
  <img src="/img/symbole.png" alt="Metcalf">
  <h1>Cette page n'existe pas.</h1>
  <p>L'adresse a peut-être changé. Tout le site tient sur une seule page.</p>
  <a href="/">Retour à l'accueil</a>
</body>
</html>
